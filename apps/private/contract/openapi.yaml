                orderId: { type: string }
                stage: { type: string, const: preview, description: Present on `create`. }
                fulfillment: { type: string, description: Present on `release`. }
                assignedInstallId: { type: [string, 'null'], description: Present on `release`. }

    InventoryMovementReason:
      type: string
      description: >
        WMS reason recorded on a movement as ledger metadata; it never changes the arithmetic.
        `reconcile` is reserved for `PUT /inventory/levels` and is not accepted here.
      enum:
        - received
        - picked
        - restock
        - cycle_count
        - damaged
        - transfer
        - adjustment

    InventoryMovementBatchWrite:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 250
          items:
            type: object
            additionalProperties: false
            required: [sku, quantityDelta, reason]
            properties:
              sku: { type: string, minLength: 1 }
              locationId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$', default: unspecified }
              quantityDelta:
                type: integer
                not: { const: 0 }
                minimum: -9007199254740991
                maximum: 9007199254740991
              reason: { $ref: '#/components/schemas/InventoryMovementReason' }

    InventoryBatchReceipt:
      type: object
      additionalProperties: false
      required: [receiptId, asOf, items]
      properties:
        receiptId: { type: string }
        asOf: { type: string, format: date-time, description: Server receive time. }
        items:
          type: array
          maxItems: 250
          description: One entry per request item, in request order.
          items:
            type: object
            additionalProperties: false
            required: [sku, locationId, quantityDelta, reason, balance]
            properties:
              sku: { type: string, description: The catalog's stored form of the SKU. }
              locationId: { type: string }
              quantityDelta: { type: integer }
              reason: { $ref: '#/components/schemas/InventoryMovementReason' }
              balance: { type: integer, description: The location's balance after the whole batch. }

    InventoryLocationWrite:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: '#/components/schemas/InventoryLocationKind' }
        isFulfillable: { type: boolean, default: true }
        status: { type: string, enum: [active, archived], default: active }

    InventoryLocationKind:
      type: string
      enum: [warehouse, 3pl, dropship_vendor, retail]

    InventoryLocation:
      type: object
      additionalProperties: false
      required: [locationId, name, kind, isFulfillable, status, updatedAt]
      properties:
        locationId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
        name: { type: string, maxLength: 200 }
        kind: { $ref: '#/components/schemas/InventoryLocationKind' }
        isFulfillable: { type: boolean }
        status: { type: string, enum: [active, archived] }
        updatedAt: { type: string, format: date-time }

    InventoryLocationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryLocation' }

    InventoryLevelsWrite:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 250
          items:
            type: object
            additionalProperties: false
            required: [sku, onHand, observedAt]
            properties:
              sku: { type: string, minLength: 1 }
              locationId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$', default: unspecified }
              onHand: { type: integer, minimum: 0, maximum: 9007199254740991 }
              observedAt: { type: string, format: date-time, maxLength: 64 }

    InventoryLevelsReceipt:
      type: object
      additionalProperties: false
      required: [receiptId, asOf, items]
      properties:
        receiptId: { type: string }
        asOf: { type: string, format: date-time, description: Server receive time. }
        items:
          type: array
          maxItems: 250
          description: One entry per request item, in request order.
          items:
            type: object
            additionalProperties: false
            required: [sku, locationId, onHand, observedAt, quantityDelta, balance]
            properties:
              sku: { type: string }
              locationId: { type: string }
              onHand: { type: integer }
              observedAt: { type: string, format: date-time }
              quantityDelta: { type: integer, description: The reconcile movement written; 0 when already equal. }
              balance: { type: integer }

    AssignmentLine:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }

    CarrierProfile:
      type: object
      x-tot-wave: 2
      x-tot-status: implemented
      description: >
        One entry of the platform carrier catalog; the catalog's codes are exactly
        `CarrierCode`. `pactEligible` is statutory eligibility only: whether the carrier may
        carry regulated parcels at all (USPS may not). Carrier contract terms belong to the
        tenant's carrier account. A tenant whose compliance enables PACT refuses a carrier
        where it is false, and a tenant requiring adult signature refuses a carrier whose
        `adultSignature` is `unsupported`. `trackingHosts` is the fail-closed allowlist for
        `trackingUrl`.
      additionalProperties: false
      required: [code, name, region, pactEligible, adultSignature, trackingHosts]
      properties:
        code: { $ref: '#/components/schemas/CarrierCode' }
        name: { type: string }
        region: { type: string, enum: [US], description: ISO 3166-1 alpha-2 country the carrier serves. }
        pactEligible: { type: boolean }
        adultSignature: { type: string, enum: [required, supported, unsupported] }
        trackingHosts:
          type: array
          minItems: 1
          items: { type: string }

    ShipmentCandidateStatus:
      type: string
      x-tot-wave: 2
      x-tot-status: planned
      description: >
        Planned (PA). Status of a shipment or label candidate. `pending_approval` holds the
        candidate until the merchant approves it; nothing ships and no label is bought while
        it is pending.
      enum: [pending_approval, approved, rejected]

    LabelVoidedData:
      type: object
      x-tot-wave: 2
      x-tot-status: implemented
      description: >
        Mirrors the asyncapi `LabelVoidedData`: the assignment, order and voided purchase id
        of an accepted `label-voided`. The REST view then reports label `none` and the next
        attempt's purchase id.
      additionalProperties: false
      required: [assignmentId, orderId, purchaseId]
      properties:
        assignmentId: { type: string }
        orderId: { type: string }
        purchaseId: { type: string }

    AssignmentShipmentWrite:
      type: object
      additionalProperties: false
      required: [lines, carrier, trackingNumber]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AssignmentLine' }
        carrier: { type: string, pattern: '^[A-Z0-9_]{2,40}$', description: A `CarrierProfile.code`. }
        service: { type: string, pattern: '^[A-Z0-9_]{1,40}$' }
        trackingNumber: { type: string, pattern: '^[A-Z0-9]{6,40}$' }
        trackingUrl: { type: string, format: uri, maxLength: 2048 }
        adultSignature: { type: string, enum: [accepted, refused, absent] }

    AssignmentShipmentView:
      type: object
      additionalProperties: false
      required: [assignmentId, shipmentId, fulfilledLines, complete]
      properties:
        assignmentId: { type: string }
        shipmentId: { type: string }
        candidateStatus: { $ref: '#/components/schemas/ShipmentCandidateStatus' }
        fulfilledLines:
          type: array
          items: { $ref: '#/components/schemas/AssignmentLine' }
        complete: { type: boolean, description: True when this shipment shipped the last line and handed the order off. }

    AssignmentExceptionWrite:
      type: object
      additionalProperties: false
      required: [lines, code]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AssignmentLine' }
        code: { type: string, enum: [vendor_rejected, backordered, out_of_stock, damaged, address_undeliverable, carrier_refused, other] }
        note: { type: string, minLength: 1, maxLength: 500, description: Free text; never contact data. }

    AssignmentExceptionView:
      type: object
      additionalProperties: false
      required: [assignmentId, exceptionId, code]
      properties:
        assignmentId: { type: string }
        exceptionId: { type: string }
        code: { type: string }
