openapi: 3.1.0
info:
  title: Storefront Private Apps API
  version: "1.2.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-contractVersion: "1"
  description: >
    Scoped, least-privilege API for installed Storefront Private Apps. All access is
    tenant-scoped from the app's JWT claims (never from caller-supplied tenant input),
    authenticated with a short-lived bearer JWT issued by the Storefront App Gateway
    (OAuth2 client-credentials grant). Every endpoint documents the single scope it
    requires. There is NO endpoint for any compliance-floor surface (see
    forbidden-scopes.json): no checkout/tax/age-identity/warning/jurisdiction/
    signed-cart/promote mutation, and no DOM/cookie/checkout access.
  contact:
    name: Token of Trust Storefront
    url: https://storefront.tokenoftrust.com
servers:
  - url: https://{tenant}.tokenoftrust.store/api/apps/v1
    description: Live tenant gateway
    variables:
      tenant:
        default: acme
  - url: https://tot-preview.tokenoftrust.store/api/apps/v1
    description: Shared preview gateway (test env)

tags:
  - name: metadata
    description: App install identity and health.
  - name: catalog
    description: Scoped catalog reads.
  - name: orders
    description: Minimal order reads.
  - name: inventory
    description: >
      Inventory availability reads, and merchant-consented stock corrections into the tenant's
      mirror ledger. An app correction is a mirror observation, never an order decrement, a
      reservation or an authoritative provider.
  - name: reports
    description: Report snapshots.
  - name: attribution
    description: App-owned idempotent attribution writes.
  - name: webhooks
    description: Delivery health and app-owned replay.
  - name: fulfillment
    description: >
      Merchant-configured fulfillment processor. An install acts only on orders whose active
      assignment names it; assignment comes from the merchant's processor configuration and
      an operator release, never from the app. Whole-order only. Refusal codes are listed on
      `FulfillmentRefusal.code`.

security:
  - appJwt: []

paths:
  /app:
    get:
      tags: [metadata]
      operationId: getAppInstall
      summary: Read this install's metadata
      description: >
        Returns the calling app's install record as resolved from the JWT: app id,
        version, tenant, env, granted scopes, status, and declared widget placements.
        Requires no additional scope beyond a valid token.
      x-requiredScope: null
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Install metadata.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInstall' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /health:
    get:
      tags: [metadata]
      operationId: getInstallHealth
      summary: Read this install's delivery/telemetry health
      description: >
        Returns webhook delivery health for the install: last success, failure streak,
        DLQ count, p95 delivery latency, last status, last error class, and recent trace
        ids. Sensitive payload bodies are never included.
      x-requiredScope: null
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Install health snapshot.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /catalog/products:
    get:
      tags: [catalog]
      operationId: listCatalogProducts
      summary: List published catalog products
      x-requiredScope: catalog:read
      description: >
        Requires scope `catalog:read`. Public catalog data only. Supports opaque keyset
        `cursor` pagination and `updatedSince` filtering (ordered by `handle ASC`), stable
        under concurrent writes. Enforces the per-install fixed-window rate limit (120
        requests per 60-second window per install; returns 429 with `Retry-After`, and fails
        closed with 503 when rate-limit state is unavailable).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: collection
          in: query
          schema: { type: string }
          description: Collection handle filter.
        - name: q
          in: query
          schema: { type: string }
          description: Free-text search.
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
          description: Opaque keyset cursor returned in a prior page's `nextCursor`. Stable under concurrent writes.
        - name: updatedSince
          in: query
          schema: { type: string, format: date-time }
          description: ISO-8601 date-time filter; returns only products updated at or after this instant.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
          description: Maximum number of products returned per page (1..100, default 24; alias of `pageSize`).
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Paged product list.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /catalog/products/{handle}:
    get:
      tags: [catalog]
      operationId: getCatalogProduct
      summary: Read one published product by handle
      x-requiredScope: catalog:read
      description: Requires scope `catalog:read`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: handle
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product detail.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List minimal orders
      x-requiredScope: orders:read:minimal
      description: >
        Requires scope `orders:read:minimal`. Returns the minimized order shape only —
        no raw checkout payload, no signed-cart material, no tax internals, customer as
        opaque hash.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: status
          in: query
          schema: { type: string, enum: [created, fulfilled, cancelled] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Paged minimal order list.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Read one minimal order
      x-requiredScope: orders:read:minimal
      description: Requires scope `orders:read:minimal`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Minimal order detail.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inventory:
    get:
      tags: [inventory]
      operationId: listInventory
      summary: Read inventory availability
      x-requiredScope: inventory:read
      description: >
        Requires scope `inventory:read`. Availability/quantity/policy per SKU only, paged
        (1..100 items per page, default 50) in deterministic `sku ASC` order with an opaque
        keyset `cursor` and `updatedSince` filter stable under concurrent writes. The tenant's
        mirror ledger for the routed stage and one location is applied the way storefront pages
        apply it; a SKU the ledger holds carries its `mirror` reading. The
        reservation-authority response header states that this projection is not reservation
        authority. Enforces the per-install fixed-window rate limit (120 requests per
        60-second window per install; returns 429 with `Retry-After`, and fails closed with
        503 when rate-limit state is unavailable).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: sku
          in: query
          schema: { type: string }
          description: Optional SKU filter.
        - name: locationId
          in: query
          schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$', default: unspecified }
          description: Ledger location to apply. Defaults to `unspecified`.
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
          description: Opaque keyset cursor returned in a prior page's `nextCursor`. Stable under concurrent writes.
        - name: updatedSince
          in: query
          schema: { type: string, format: date-time }
          description: ISO-8601 date-time filter; returns only SKUs whose mirror ledger reading or catalog product was updated at or after this instant.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Maximum number of inventory items returned per page (1..100, default 50).
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Page size alias for `limit` (1..100, default 50).
      responses:
        '200':
          description: Paged inventory list.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /inventory/movements:
    post:
      tags: [inventory]
      operationId: recordInventoryMovement
      summary: Record one per-SKU, per-location stock correction (idempotent)
      x-requiredScope: inventory:write
      description: >
        Requires scope `inventory:write` on an active install of the host tenant whose env
        matches the routed stage. Authority: the write is a merchant-consented mirror
        correction in the tenant's ledger. It never decrements for an order, never
        reserves and never makes the app an authoritative provider. The install's consent is
        checked when the movement commits, so a suspend, uninstall or scope removal committed
        before the write refuses it.
        Delta semantics: `quantityDelta` is a nonzero safe integer added to the ledger
        balance of (`sku`, `locationId`). The resulting balance must stay between 0 and
        2^53-1; a positive delta on a negative balance is accepted when it does not move the
        balance further below zero. Overflow is refused, never clamped. `sku` must be in
        the tenant catalog; `locationId` is `unspecified` (the default) or a location that
        already has movements in this tenant's ledger for this stage.
        Server-derived fields: `asOf` is the server receive time, `source` the app
        namespace, `actorId` the install, and the event id a digest of the idempotency key.
        A body naming any of them is refused with 400 `server-derived-field`.
        Idempotency: `Idempotency-Key` is REQUIRED, scoped to the install, tenant, stage
        and operation, and bound to the canonical body. A same-key, same-body retry returns
        the original receipt; another body answers 409 `idempotency-conflict`; concurrent
        duplicates apply once.
        Conflict and reconciliation: a later source on-hand observation (by commit order)
        sets the balance to the observed value, and an app correction committed before it
        does not survive it. Every row remains in the ledger. Fulfilment progress is a
        separate write-back: `POST /fulfillment/orders/{orderId}/shipment-evidence`.
        No event is emitted. Response is always `cache-control: no-store`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryMovementWrite' }
      responses:
        '201':
          description: The correction is recorded, or this is the replay of the receipt under the same key.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryReceipt' }
        '400': { $ref: '#/components/responses/InventoryRefused' }
        '401': { $ref: '#/components/responses/InventoryRefused' }
        '403': { $ref: '#/components/responses/InventoryRefused' }
        '409': { $ref: '#/components/responses/InventoryRefused' }
        '422': { $ref: '#/components/responses/InventoryRefused' }
        '503': { $ref: '#/components/responses/InventoryRefused' }

  /reports:
    get:
      tags: [reports]
      operationId: listReports
      summary: List report snapshots
      x-requiredScope: reports:read
      description: Requires scope `reports:read`. Aggregate snapshots only.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Report snapshot list.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /attribution:
    post:
      tags: [attribution]
      operationId: writeAttribution
      summary: Write an app-owned attribution/commission record (idempotent)
      x-requiredScope: attribution:write
      description: >
        Requires scope `attribution:write`. Idempotent: the `Idempotency-Key` header is
        REQUIRED. A replay reusing a key with a DIFFERENT request body (body hash
        mismatch) is rejected with 409. Writes only into the app's own attribution
        namespace — it cannot alter orders, price, tax, or checkout. The referenced
        `orderId` MUST belong to the calling tenant/install; an order that is not owned by
        this tenant is rejected with 403 under the same tenant-ownership rule as reads.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributionWrite' }
      responses:
        '201':
          description: Attribution record created (or the stable prior result on idempotent replay).
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttributionRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency-Key reused with a mismatched body hash.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /webhooks/deliveries:
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: List recent webhook delivery records for this install
      x-requiredScope: null
      x-authorization: install-owns-delivery
      description: >
        Authorized by app-install ownership, not a single event scope: any installed app
        with at least one active webhook subscription may list ITS OWN delivery records
        (a delivery is visible only to the install that received it). Returns status,
        attempt count, DLQ state, and trace ids. Sensitive payload bodies are redacted by
        default.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: state
          in: query
          schema: { type: string, enum: [delivered, retrying, dead-lettered] }
      responses:
        '200':
          description: Delivery record list.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /webhooks/deliveries/{deliveryId}/replay:
    post:
      tags: [webhooks]
      operationId: replayWebhookDelivery
      summary: Replay a delivery for this app installation
      x-requiredScope: null
      x-authorization: install-owns-delivery
      description: >
        Authorized by app-install ownership, not a single event scope: an installed app may
        replay only a delivery it owns (any active webhook subscription qualifies).
        Re-enqueues a prior delivery. Idempotent via `Idempotency-Key`; the original event id
        and schema version are preserved so the receiver can dedupe.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: deliveryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Replay accepted and enqueued.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency-Key reused with a mismatched body hash.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /fulfillment/assignments:
    get:
      tags: [fulfillment]
      operationId: listFulfillmentAssignments
      summary: Reconciliation read of this install's active fulfillment assignments
      x-requiredScope: fulfillment:process
      description: >
        Requires scope `fulfillment:process` in both the install grant and the token. Returns
        only assignments whose tenant is the host tenant, whose stage is the routed stage
        (live is publication, test is preview), whose install is the calling install and
        whose state is `active`, joined to the order at its current event version with
        release eligibility recomputed live. An order that fails the recompute (not
        releasable, or a release hold) is omitted
        while its assignment stays `active`, and reappears when the hold clears; no event
        fires for the omission. Held, cancelled, released, not-releasable, other-install,
        other-stage, other-tenant and nonexistent orders are absent, indistinguishably. This
        is the processor's recovery path when a `fulfillment.assignment.*` delivery is late
        or lost. No customer identity. Response is `cache-control: no-store`. A `tenant`,
        `tenantId` or `stage` query parameter answers 403 `denied`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a prior page's `nextCursor`. An unknown cursor returns no rows.
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Active assignments for this install, oldest assignment first.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
            traceparent: { $ref: '#/components/headers/Traceparent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentAssignmentList' }
        '401': { $ref: '#/components/responses/FulfillmentRefused' }
        '403': { $ref: '#/components/responses/FulfillmentRefused' }
        '409': { $ref: '#/components/responses/FulfillmentRefused' }
        '503': { $ref: '#/components/responses/FulfillmentRefused' }

  /fulfillment/orders/{orderId}/recipient:
    get:
      tags: [fulfillment]
      operationId: readFulfillmentRecipient
      summary: Export the ship-to recipient of one order assigned to this install
      x-requiredScope: orders:read:recipient
      description: >
        Requires scope `orders:read:recipient` in both the install grant and the token, a live
        owner consent for (install, tenant, stage, purpose `fulfillment-shipping`), and an
        active assignment of the order naming the calling install. One opaque order id in
        the path, no body, no list or search. Admission is one guarded insert into the
        append-only app contact-access audit (install active with the scope, active
        assignment at the evaluated order version, live consent, fewer than
        the per-install hourly quota of admitted reads);
        nothing is decrypted before that row commits, and only the ship group is opened.
        Contact state is classified only after admission, so an unassigned order reveals
        nothing about its contact. Stage is the routed stage, and the stage the order's contact
        is recorded under must equal it, else 409 `stage-unknown`. Emits no event. Success and every refusal carry
        `cache-control: no-store`; error bodies never carry a contact value.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/FulfillmentOrderId'
      responses:
        '200':
          description: The order's ship-to recipient.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentRecipient' }
        '401': { $ref: '#/components/responses/FulfillmentRefused' }
        '403': { $ref: '#/components/responses/FulfillmentRefused' }
        '404': { $ref: '#/components/responses/FulfillmentRefused' }
        '409': { $ref: '#/components/responses/FulfillmentRefused' }
        '410': { $ref: '#/components/responses/FulfillmentRefused' }
        '429': { $ref: '#/components/responses/FulfillmentRefused' }
        '503': { $ref: '#/components/responses/FulfillmentRefused' }

  /fulfillment/orders/{orderId}/shipment-evidence:
    post:
      tags: [fulfillment]
      operationId: recordFulfillmentShipmentEvidence
      summary: Report a label outcome or a confirmed handoff for an assigned order (idempotent)
      x-requiredScope: fulfillment:process
      description: >
        Requires scope `fulfillment:process` and an active assignment of the order naming the
        calling install, bound by `assignmentId` in the body. Whole-order only. The body is
        one of two closed facts: `label-outcome` (the external label provider's result under
        the platform purchase id) or `handoff` (the carrier accepted the parcel). Storefront
        never buys a label and never contacts a carrier. `Idempotency-Key` is REQUIRED and
        scoped to the calling install; its hash covers the canonical body, the assignment id
        and the order id. A same-key, same-body retry returns the original response; a
        same-key retry with another body or assignment answers 409 `idempotency-conflict`.
        `order.fulfilled` is emitted only by an accepted handoff. Response is always the
        minimized `AppShipmentView`, `cache-control: no-store`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/FulfillmentOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentEvidence' }
      responses:
        '200':
          description: >
            The fact is recorded, was already recorded identically (`outcome: done`), or this
            is the replay of an earlier response under the same key.
          headers:
            tot-request-id: { $ref: '#/components/headers/TotRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppShipmentView' }
        '400': { $ref: '#/components/responses/FulfillmentRefused' }
        '401': { $ref: '#/components/responses/FulfillmentRefused' }
        '403': { $ref: '#/components/responses/FulfillmentRefused' }
        '404': { $ref: '#/components/responses/FulfillmentRefused' }
        '409': { $ref: '#/components/responses/FulfillmentRefused' }
        '503': { $ref: '#/components/responses/FulfillmentRefused' }

components:
  securitySchemes:
    appJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived JWT access token issued by the Storefront App Gateway via the OAuth2
        client-credentials grant. The client secret is server-side only and never
        returned after creation. Tokens are verified against the gateway JWKS at
        `/.well-known/jwks.json`; authorization metadata (issuer, supported scopes,
        HTTP Message Signature keys) is published at
        `/.well-known/tot-app-authorization-metadata`. Required claims: `iss`, `aud`,
        `sub` (app-install-id), `tenant`, `env`, `scopes`, `iat`, `exp`, `jti`.
        The token-issuance endpoint is documented separately from this app API. Use only the
        installation credentials supplied through the approved setup flow. JWKS and
        authorization-metadata discovery belong here.

  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. Propagated through the gateway and echoed on the response.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated idempotency key. Required on all writes. Reusing a key with a
        different request body (body hash mismatch) is rejected with 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    FulfillmentOrderId:
      name: orderId
      in: path
      required: true
      description: Opaque platform order id, as carried by `fulfillment.assignment.*` and the reconciliation read.
      schema: { type: string, minLength: 1, maxLength: 128 }

  headers:
    TotRequestId:
      description: Per-request correlation id, present on every response.
      schema: { type: string }
    Traceparent:
      description: Echoed W3C Trace Context for the served request.
      schema: { type: string }
    RetryAfter:
      description: Seconds remaining until the per-install rate-limit window resets.
      schema: { type: integer, minimum: 1 }
    RateLimitLimit:
      description: Maximum requests permitted per install in the rate-limit window (120 per 60-second window).
      schema: { type: integer, minimum: 1 }
    RateLimitRemaining:
      description: Remaining requests permitted for this install in the current window.
      schema: { type: integer, minimum: 0 }
    RateLimitReset:
      description: Unix epoch seconds when the current per-install rate-limit window resets.
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Missing, expired, malformed, or revoked token; suspended/uninstalled app.
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Token valid but lacks the required scope, or tenant claim mismatch.
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found for this tenant.
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request (e.g. missing Idempotency-Key, malformed cursor or updatedSince).
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: >
        Per-install fixed-window rate limit exceeded (120 requests per 60-second window per
        install). Back off for at least `Retry-After` seconds before retrying.
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: >
        Backing storage or rate-limit state is unconfigured or unavailable (`unavailable` /
        `unconfigured`).
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Well-formed request that fails validation.
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FulfillmentRefused:
      description: >
        A refusal from a `/fulfillment/*` route. The status and `code` pairs are listed on
        `FulfillmentRefusal.code`. Always `cache-control: no-store`; never carries a contact
        value, a thrown message or detail that distinguishes another tenant's order.
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FulfillmentRefusal' }

    InventoryRefused:
      description: >
        A refusal from `POST /inventory/movements`. Status and `code` pairs are listed on
        `InventoryRefusal.code`. Always `cache-control: no-store`; refused writes leave no
        movement and no receipt.
      headers:
        tot-request-id: { $ref: '#/components/headers/TotRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InventoryRefusal' }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code (e.g. scope_denied, tenant_mismatch, idempotency_conflict, token_expired).
        message: { type: string }
        requestId: { type: string }

    AppInstall:
      type: object
      additionalProperties: false
      required: [appId, appVersion, tenant, env, scopes, status]
      properties:
        appId: { type: string }
        appVersion: { type: string }
        installId: { type: string, description: The app-install-id (JWT sub). }
        tenant: { type: string }
        env: { type: string, enum: [development, test, sandbox, production] }
        status: { type: string, enum: [active, suspended] }
        scopes:
          type: array
          items:
            type: string
            enum:
              - catalog:read
              - orders:read:minimal
              - orders:webhook
              - customers:read:minimal
              - inventory:read
              - inventory:write
              - reports:read
              - attribution:write
              - widgets:launch
              - fulfillment:process
              - orders:read:recipient
        widgetPlacements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [placement, endpoint]
            properties:
              placement:
                type: string
                enum: [product.aside, home.section, global.footer]
              endpoint:
                type: string
                format: uri
                description: HTTPS URL that serves the sandboxed widget's content. Must be https.
              title:
                type: string
                description: Label shown near the widget in approved placement controls.

    InstallHealth:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        lastSuccessAt: { type: string, format: date-time }
        failureStreak: { type: integer, minimum: 0 }
        dlqCount: { type: integer, minimum: 0 }
        p95DeliveryMs: { type: integer, minimum: 0 }
        lastStatus: { type: integer }
        lastErrorClass: { type: string }
        recentTraceIds:
          type: array
          items: { type: string }

    ProductList:
      type: object
      additionalProperties: false
      required: [products, page, pageSize, total]
      properties:
        products:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        nextCursor:
          type: [string, 'null']
          description: Opaque keyset cursor for the next page, or null on the final page.

    Product:
      type: object
      description: Minimized public catalog product (subset of the storefront CatalogProduct).
      additionalProperties: false
      required: [id, handle, title, status, priceRange]
      properties:
        id: { type: string }
        handle: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, draft, archived] }
        vendor: { type: string }
        productType: { type: string }
        tags:
          type: array
          items: { type: string }
        priceRange:
          type: object
          additionalProperties: false
          required: [min, max, currency]
          properties:
            min: { type: number }
            max: { type: number }
            currency: { type: string, description: ISO 4217. }
        updatedAt: { type: string, format: date-time }

    OrderList:
      type: object
      additionalProperties: false
      required: [orders, page, pageSize, total]
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    Order:
      type: object
      description: >
        Minimized order. Deliberately excludes raw checkout payload, signed-cart
        material, tax-computation internals, and raw customer PII.
      additionalProperties: false
      required: [id, status, currency, customerHash, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [created, fulfilled, cancelled] }
        currency: { type: string }
        customerHash:
          type: string
          description: >
            Opaque customer hash, stable per (tenant, app-install-id): consistent within
            this app install but not comparable across apps on the same tenant. Not
            reversible to PII.
        subtotal: { type: number }
        total: { type: number }
        lineItems:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sku, quantity]
            properties:
              sku: { type: string }
              handle: { type: string }
              quantity: { type: integer, minimum: 1 }
              lineTotal: { type: number }
        createdAt: { type: string, format: date-time }
        fulfilledAt: { type: string, format: date-time }

    InventoryList:
      type: object
      additionalProperties: false
      required: [items, pageSize, total]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [sku, available]
            properties:
              sku: { type: string }
              available: { type: boolean }
              quantity: { type: integer }
              policy: { type: string, enum: [deny, continue] }
              mirror:
                type: object
                additionalProperties: false
                required: [locationId, balance, asOf]
                description: The mirror ledger reading for this SKU at the requested location.
                properties:
                  locationId: { type: string }
                  balance: { type: integer }
                  asOf: { type: string, format: date-time }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        nextCursor:
          type: [string, 'null']
          description: Opaque keyset cursor for the next page, or null on the final page.

    InventoryMovementWrite:
      type: object
      additionalProperties: false
      required: [sku, quantityDelta]
      properties:
        sku: { type: string, minLength: 1 }
        locationId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$', default: unspecified }
        quantityDelta:
          type: integer
          not: { const: 0 }
          minimum: -9007199254740991
          maximum: 9007199254740991

    InventoryReceipt:
      type: object
      additionalProperties: false
      required: [receiptId, sku, locationId, quantityDelta, asOf, balance]
      properties:
        receiptId: { type: string }
        sku: { type: string, description: The catalog's stored form of the SKU. }
        locationId: { type: string }
        quantityDelta: { type: integer }
        asOf: { type: string, format: date-time, description: Server receive time. }
        balance: { type: integer, description: Ledger balance for the SKU and location after this correction. }

    InventoryRefusal:
      type: object
      additionalProperties: false
      required: [code, error]
      properties:
        code:
          type: string
          enum:
            - malformed
            - server-derived-field
            - invalid_token
            - scope_denied
            - denied
            - unknown-sku
            - unknown-location
            - balance-out-of-range
            - idempotency-conflict
            - unavailable
          description: >
            400 malformed (body, key or query outside the contract), 400 server-derived-field,
            401 invalid_token (also a suspended or uninstalled install), 403 scope_denied,
            403 denied (tenant or stage mismatch), 422 unknown-sku, 422 unknown-location,
            409 balance-out-of-range, 409 idempotency-conflict, 503 unavailable.
        error: { type: string }

    ReportList:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, generatedAt]
            properties:
              id: { type: string }
              title: { type: string }
              generatedAt: { type: string, format: date-time }
              format: { type: string, enum: [json, csv] }
              downloadUrl: { type: string, format: uri }

    AttributionWrite:
      type: object
      description: App-owned attribution/commission record. References platform ids; never mutates them.
      additionalProperties: false
      required: [attributionId, orderId]
      properties:
        attributionId:
          type: string
          description: App-generated stable id for this attribution event.
        orderId:
          type: string
          description: >
            The order this attribution references (read-only reference). MUST belong to the
            calling tenant/install; a cross-tenant orderId is rejected with 403.
        campaign: { type: string }
        referralCode: { type: string }
        customerHash:
          type: string
          description: >
            The app's OWN per-(tenant, app-install) customerHash, as echoed back from a prior
            GET /orders / GET /orders/{id} read — a 64-character hex sha256 digest. Never a raw
            customer identifier; validated against that shape and rejected (400) otherwise. Not
            re-hashed — stored exactly as given.
        commission:
          type: object
          additionalProperties: false
          properties:
            amount: { type: number }
            currency: { type: string }

    AttributionRecord:
      type: object
      additionalProperties: false
      required: [attributionId, orderId, recordedAt]
      properties:
        attributionId: { type: string }
        orderId: { type: string }
        campaign: { type: string }
        referralCode: { type: string }
        commission:
          type: object
          additionalProperties: false
          properties:
            amount: { type: number }
            currency: { type: string }
        recordedAt: { type: string, format: date-time }

    FulfillmentRefusal:
      type: object
      additionalProperties: false
      required: [code, error]
      properties:
        code:
          type: string
          description: >
            Stable refusal code; the only field a client branches on. Every /fulfillment/*
            route: 401 invalid_token (missing, invalid or expired token, another tenant's
            install, a suspended or uninstalled install; byte-identical, no detail); 403
            scope_denied; 403 denied (a tenant, tenantId or stage query parameter); 409
            stage-unknown (unresolvable routed stage, or on the recipient read an order
            stage that is unresolvable or differs from it; nothing read or written); 503
            unconfigured (app gateway) or unavailable (storage).
            Recipient and shipment-evidence: 404 not-assigned (no assignment of this order has
            ever named the calling install, including nonexistent, other-tenant and
            other-stage orders; one code, no oracle); 409 assignment-held (this install's
            assignment is held; on the recipient read also an active assignment whose order is
            not releasable at its current event version, with no `holds`); 409 assignment-ended (this install's assignment was cancelled
            or released, or the body binds a superseded assignment). Recipient only: 403
            consent-missing, consent-revoked, consent-expired (no live owner consent for this
            install, stage and purpose); 429 quota; 410 contact-erased; 410 contact-expired;
            404 contact-absent; 409 contact-unreadable; 503 audit-unavailable; 503
            vault-key-unavailable. Shipment-evidence only: 400 malformed (body outside the
            closed schema, unknown carrier, unsafe or over-long tracking URL, missing
            Idempotency-Key); 409 idempotency-conflict; 409 label-regress; 409 conflict (a
            differing carrier, service, tracking number or adult result under one purchase id,
            or a purchase id other than the platform's); 409 carrier-prohibited; 409
            carrier-mismatch; 409 with a readiness handoff-refusal code (a release hold such
            as operator-hold or payment-not-captured, or adult-signature, label, reconcile,
            fulfillment, evidence, payment, stock, ship-to) and `holds`.
        error:
          type: string
          description: >
            Human-readable text, never parsed. Equal to `code` on every refusal except the two
            the shared app-gateway authorizer writes: 401 invalid_token carries `Unauthorized`
            and 503 unconfigured carries `app gateway not configured`.
        holds:
          type: array
          items: { type: string }
          description: Present only on a handoff refusal; the release holds in force.

    FulfillmentAssignmentList:
      type: object
      additionalProperties: false
      required: [assignments]
      properties:
        assignments:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/FulfillmentAssignment' }
        nextCursor: { type: string, description: Absent on the last page. }

    FulfillmentAssignment:
      type: object
      description: >
        One active assignment whose order is releasable at `eventVersion`. No customer
        identity; the recipient is a separate, consent-gated read.
      additionalProperties: false
      required: [assignmentId, orderId, stage, eventVersion, assignedAt, purchaseId, lineItems]
      properties:
        assignmentId: { type: string }
        orderId: { type: string }
        stage: { type: string, enum: [preview, publication] }
        eventVersion: { type: integer, minimum: 0, description: The order event version eligibility was recomputed at. }
        assignedAt: { type: string, format: date-time }
        purchaseId:
          type: string
          description: >
            The platform purchase id for this order's whole-order label. The processor
            reports every label outcome and the handoff under this id.
        lineItems:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [sku, quantity]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }

    FulfillmentRecipient:
      type: object
      description: >
        The ship-to recipient of one assigned order. No email, phone, bill-to or customer
        identity group. Absent optional fields are omitted, never null.
      additionalProperties: false
      required: [orderId, line1, city, country]
      properties:
        orderId: { type: string }
        name: { type: string, description: Omitted when the sealed ship-to has no name. }
        company: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2. }

    ShipmentEvidence:
      oneOf:
        - $ref: '#/components/schemas/LabelOutcomeEvidence'
        - $ref: '#/components/schemas/HandoffEvidence'
      discriminator:
        propertyName: kind
        mapping:
          label-outcome: '#/components/schemas/LabelOutcomeEvidence'
          handoff: '#/components/schemas/HandoffEvidence'

    LabelOutcomeEvidence:
      type: object
      description: >
        The external label provider's result for the whole-order label. Allowed label moves:
        intent to purchased, unknown or voided; unknown to purchased or voided; purchased to
        purchased only with identical facts. No move leaves voided. `unknown` is reconciled
        under the same purchase id and never re-purchased. A voided or unresolved label is
        finished by the merchant desk once the assignment is released. The adult-signature
        result is attested by the install.
      additionalProperties: false
      required: [kind, assignmentId, purchaseId, outcome]
      properties:
        kind: { type: string, const: label-outcome }
        assignmentId: { type: string }
        purchaseId: { type: string }
        outcome: { type: string, enum: [purchased, unknown, voided] }
        carrier: { $ref: '#/components/schemas/CarrierCode' }
        service: { type: string, pattern: '^[A-Z0-9_]{1,40}$' }
        trackingNumber: { type: string, pattern: '^[A-Z0-9]{6,40}$' }
        trackingUrl:
          type: string
          format: uri
          maxLength: 2048
          description: >
            https only, on the carrier's tracking host allowlist; no userinfo, port, fragment
            or IP literal; path and query each at most 512 characters. Never fetched by the
            platform. The path and query are free text the app supplies; the platform checks
            only this shape, does not inspect them for contact, stores the URL in the order's
            label-outcome audit and returns it in AppShipmentView.tracking.url.
        adultSignature: { type: string, enum: [accepted, refused, absent] }
        expectedVersion: { type: integer, minimum: 0 }
      allOf:
        - if:
            properties: { outcome: { const: purchased } }
          then:
            required: [carrier, service, trackingNumber, trackingUrl, adultSignature]

    HandoffEvidence:
      type: object
      description: >
        The carrier accepted the whole-order parcel. Refused unless the label is purchased or
        printed and every handoff gate holds; the carrier must equal the label carrier. An
        accepted handoff emits order.fulfilled once.
      additionalProperties: false
      required: [kind, assignmentId, purchaseId, carrier]
      properties:
        kind: { type: string, const: handoff }
        assignmentId: { type: string }
        purchaseId: { type: string }
        carrier: { $ref: '#/components/schemas/CarrierCode' }
        expectedVersion: { type: integer, minimum: 0 }

    CarrierCode:
      type: string
      description: >
        Closed set of canonical uppercase carrier codes. Input is trimmed and uppercased
        before comparison; any other value answers 400 malformed. A code in the tenant's
        prohibited set (current policy or the order's label-intent snapshot) answers 409
        carrier-prohibited.
      enum: [UPS, FEDEX, USPS, DHL]

    AppShipmentView:
      type: object
      description: Minimized shipment state of one assigned order. Never the merchant desk view.
      additionalProperties: false
      required: [orderId, version, label, handoff, purchaseId]
      properties:
        orderId: { type: string }
        version: { type: integer, minimum: 0, description: The order event version after this command. }
        label: { type: string, enum: [none, intent, purchased, printed, UNKNOWN, void_requested, voided] }
        handoff: { type: string, enum: [none, handed_off, unknown] }
        purchaseId: { type: string }
        carrier: { $ref: '#/components/schemas/CarrierCode' }
        tracking:
          type: object
          additionalProperties: false
          required: [number, url]
          properties:
            number: { type: string }
            url: { type: string, format: uri }

    DeliveryList:
      type: object
      additionalProperties: false
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/Delivery' }

    Delivery:
      type: object
      additionalProperties: false
      required: [deliveryId, eventId, topic, state]
      properties:
        deliveryId: { type: string }
        eventId: { type: string }
        topic:
          type: string
          enum:
            - app.installed
            - app.uninstalled
            - catalog.product.updated
            - inventory.changed
            - order.created
            - order.fulfilled
            - customer.marketing_consent.updated
            - attribution.finalized
            - fulfillment.assignment.created
            - fulfillment.assignment.updated
        state: { type: string, enum: [delivered, retrying, dead-lettered] }
        attempts: { type: integer, minimum: 0 }
        lastStatus: { type: integer }
        lastTraceId: { type: string }
        updatedAt: { type: string, format: date-time }
