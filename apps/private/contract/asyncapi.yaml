asyncapi: 2.6.0
id: 'urn:com:tokenoftrust:storefront:private-apps:webhooks'
info:
  title: Storefront Private Apps Webhook Spine
  version: "1.3.0"
  description: >
    Outbound webhook events delivered to installed Storefront Private Apps. Every event
    is a CloudEvents 1.0 JSON envelope delivered over HTTPS POST and signed with HTTP
    Message Signatures (RFC 9421). The app verifies the signature against the gateway's
    published keys (JWKS / `/.well-known/tot-app-authorization-metadata`). Delivery is
    at-least-once with retries, dead-lettering, and admin/app replay; receivers dedupe on
    the CloudEvents `id`. No event grants an app the ability to approve restricted sales
    or change any compliance obligation (see forbidden-scopes.json).


    Stage routing. Every event belongs to one stage: `preview` (events from the preview
    ledger, including synthetic test orders) or `publication` (live). An event is delivered
    only to installs whose env matches that stage: env `test` receives preview events and env
    `production` receives publication events. A test install never receives a live event and
    a production install never receives a preview event.


    Channels marked `x-tot-wave: 2` with `x-tot-status: planned` are locked wire shapes that
    no emitter produces yet. Their types are listed in `components.x-tot-planned-event-types`
    and are not part of the `CloudEventEnvelope.type` enum until implemented.

defaultContentType: application/cloudevents+json

tags:
  - name: private-apps
    description: Storefront Private Apps outbound webhook events.

servers:
  gateway:
    url: '{tenant}.tokenoftrust.store'
    protocol: https
    description: >
      The app's own HTTPS endpoint (declared in tot-app.json `webhooks.endpoint`) receives
      the POST. This server block documents the delivering gateway origin per tenant.
    variables:
      tenant:
        default: acme

channels:
  app.installed:
    description: Emitted when an app install is activated for a tenant. Delivered to the install's own endpoint.
    subscribe:
      operationId: onAppInstalled
      bindings:
        http:
          type: request
          method: POST
      message:
        $ref: '#/components/messages/AppInstalled'

  app.uninstalled:
    description: Emitted when an app install is uninstalled. Final delivery before credentials/placements are revoked.
    subscribe:
      operationId: onAppUninstalled
      message:
        $ref: '#/components/messages/AppUninstalled'

  catalog.product.updated:
    description: Emitted when a published catalog product changes. Requires scope catalog:read.
    subscribe:
      operationId: onCatalogProductUpdated
      message:
        $ref: '#/components/messages/CatalogProductUpdated'

  inventory.changed:
    description: >
      Emitted once on every committed inventory ledger movement (app correction, source
      on-hand observation, catalog import, and order decrement). Requires scope
      inventory:read. Carries SKU, location, the resulting balance and as-of stamp, with no
      customer identity. Planned (Wave 2, PB): `PUT /inventory/levels` and the batch form of
      `POST /inventory/movements` emit one event per committed (sku, location) change.
    subscribe:
      operationId: onInventoryChanged
      message:
        $ref: '#/components/messages/InventoryChanged'

  order.created:
    description: Emitted when an order is created. Requires scope orders:webhook. Minimized order payload.
    subscribe:
      operationId: onOrderCreated
      message:
        $ref: '#/components/messages/OrderCreated'

  order.fulfilled:
    description: >
      Emitted when an order is fulfilled. Requires scope orders:webhook. With per-assignment
      shipments it is emitted once, by the shipment that ships the last unshipped line.
    subscribe:
      operationId: onOrderFulfilled
      message:
        $ref: '#/components/messages/OrderFulfilled'

  customer.marketing_consent.updated:
    description: Emitted when a customer's marketing consent changes. Requires scope customers:read:minimal. Opaque customer id only.
    subscribe:
      operationId: onCustomerMarketingConsentUpdated
      message:
        $ref: '#/components/messages/CustomerMarketingConsentUpdated'

  attribution.finalized:
    description: Emitted when an attribution/commission record is finalized. Requires scope attribution:write.
    subscribe:
      operationId: onAttributionFinalized
      message:
        $ref: '#/components/messages/AttributionFinalized'

  fulfillment.assignment.created:
    description: >
      Emitted when an operator release assigns an order exclusively to this install as the
      merchant-configured fulfillment processor for the order's stage. Requires scope
      fulfillment:process. Delivered only to the assigned install. Carries no customer
      identity; the processor pulls the ship-to recipient with GET
      /fulfillment/orders/{orderId}/recipient. A notification, never an authorization:
      every app read and write re-checks the active assignment.
    subscribe:
      operationId: onFulfillmentAssignmentCreated
      message:
        $ref: '#/components/messages/FulfillmentAssignmentCreated'

  fulfillment.assignment.updated:
    description: >
      Emitted when this install's assignment changes state: held (operator hold or a pending
      cancel or refund), active again (hold cleared, same install), or cancelled (a
      source-confirmed cancel or refund). Requires scope fulfillment:process. Delivered only
      to the assigned install. A release (processor switched or cleared, install suspended,
      uninstalled or descoped) emits no event.
    subscribe:
      operationId: onFulfillmentAssignmentUpdated
      message:
        $ref: '#/components/messages/FulfillmentAssignmentUpdated'

  order.partially_fulfilled:
    description: >
      Emitted for every accepted assignment shipment that leaves at least one assignment
      line unshipped. Requires scope orders:webhook. Same minimized order payload as
      order.created, with `status` `created` until the last line ships.
    subscribe:
      operationId: onOrderPartiallyFulfilled
      message:
        $ref: '#/components/messages/OrderPartiallyFulfilled'

  fulfillment.label.voided:
    x-tot-wave: 2
    x-tot-status: planned
    description: >
      Planned (PA). Emitted when the label of an assignment moves to `voided`, so the
      processor learns of a voided label without polling. Requires scope fulfillment:process.
      Delivered only to the assigned install. Carries no customer identity.
    subscribe:
      operationId: onFulfillmentLabelVoided
      message:
        $ref: '#/components/messages/FulfillmentLabelVoided'

components:
  x-tot-planned-event-types:
    - com.tokenoftrust.storefront.fulfillment.label.voided

  messageTraits:
    cloudEventEnvelope:
      headers:
        type: object
        description: HTTP delivery headers. The message is signed with HTTP Message Signatures.
        properties:
          Content-Type:
            type: string
            const: application/cloudevents+json
          Signature-Input:
            type: string
            description: RFC 9421 signature parameters (keyid, created, covered components).
          Signature:
            type: string
            description: RFC 9421 signature value over the covered components + body digest.
          Content-Digest:
            type: string
            description: RFC 9530 digest of the request body, covered by the signature.
        required: [Content-Type, Signature-Input, Signature, Content-Digest]

  schemas:
    CloudEventEnvelope:
      type: object
      description: CloudEvents 1.0 structured JSON envelope. `data` varies by event type.
      additionalProperties: false
      required: [specversion, id, source, type, time, datacontenttype, tenantid, appinstallid, dataschemaversion, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          description: Unique event id. Stable across retries and replays; receivers dedupe on it.
        source:
          type: string
          format: uri-reference
          description: Emitting gateway + tenant, e.g. /tenants/acme/storefront.
        type:
          type: string
          description: Reverse-DNS event type, prefixed com.tokenoftrust.storefront.
          enum:
            - com.tokenoftrust.storefront.app.installed
            - com.tokenoftrust.storefront.app.uninstalled
            - com.tokenoftrust.storefront.catalog.product.updated
            - com.tokenoftrust.storefront.inventory.changed
            - com.tokenoftrust.storefront.order.created
            - com.tokenoftrust.storefront.order.fulfilled
            - com.tokenoftrust.storefront.order.partially_fulfilled
            - com.tokenoftrust.storefront.customer.marketing_consent.updated
            - com.tokenoftrust.storefront.attribution.finalized
            - com.tokenoftrust.storefront.fulfillment.assignment.created
            - com.tokenoftrust.storefront.fulfillment.assignment.updated
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschemaversion:
          type: string
          description: Schema version of the `data` payload (semver, contract-scoped).
          const: "1"
        tenantid:
          type: string
          description: CloudEvents extension. The tenant this event belongs to.
        appinstallid:
          type: string
          description: CloudEvents extension. The app-install-id this delivery targets.
        retrycount:
          type: integer
          minimum: 0
          description: CloudEvents extension. Delivery attempt count (0 on first attempt).
        totrequestid:
          type: string
          description: CloudEvents extension. Correlation id matching the API tot-request-id header.
        traceparent:
          type: string
          description: CloudEvents extension. W3C Trace Context for end-to-end tracing.
        data:
          type: object
          description: Event-specific payload; shape determined by `type`.

    OrderData:
      type: object
      additionalProperties: false
      required: [id, status, currency]
      properties:
        id: { type: string }
        status: { type: string, enum: [created, fulfilled, cancelled] }
        currency: { type: string }
        customerHash: { type: string, description: "Reserved; NOT populated by V1's order.created/order.fulfilled fan-out. order.* is a tenant-wide fan-out to every subscribed install at once, so there is no single install to salt a per-install customerHash against — and a coarser, per-tenant-only hash was deliberately rejected rather than reused as a substitute, so V1 events carry no customer hash at all. Kept optional (not removed) only in case a differently-scoped mechanism is added later; see docs/private-apps/order-forward-contract.md." }
        subtotal: { type: number }
        total: { type: number }
        lineItems:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sku, quantity]
            properties:
              sku: { type: string }
              handle: { type: string }
              quantity: { type: integer }
              lineTotal: { type: number }

    CatalogProductUpdateData:
      type: object
      additionalProperties: false
      required: [handle]
      properties:
        handle: { type: string }
        id: { type: string }

    InventoryChangedData:
      type: object
      additionalProperties: false
      description: >
        Closed five-key payload, scoped to one commerce stage. Emitted on every committed
        inventory ledger movement, and whenever a sku's available quantity changes (a
        reservation, release, expiry, or a location's status or fulfillability changing). Carries
        only SKU, location, that location's balance, the sku's available quantity and the as-of
        stamp — no customer identity or order fields.
      required: [sku, locationId, balance, available, asOf]
      properties:
        sku: { type: string, minLength: 1 }
        locationId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
        balance:
          type: integer
          description: On-hand at locationId, net of confirmed allocations there.
        available:
          type: integer
          description: >
            Sum of on-hand over the tenant's active fulfillable locations, minus active
            (reserved or confirmed) allocations at those locations. Zero or below means sold out.
        asOf: { type: string, format: date-time }

    CustomerMarketingConsentUpdatedData:
      type: object
      additionalProperties: false
      required: [customerHash, marketingConsent]
      properties:
        customerHash: { type: string }
        marketingConsent: { type: boolean }
        updatedAt: { type: string, format: date-time }

    AttributionFinalizedData:
      type: object
      additionalProperties: false
      required: [attributionId, orderId]
      properties:
        attributionId: { type: string }
        orderId: { type: string }
        campaign: { type: string }
        commission:
          type: object
          additionalProperties: false
          properties:
            amount: { type: number }
            currency: { type: string }

    FulfillmentAssignmentData:
      type: object
      additionalProperties: false
      description: >
        Exactly these six keys for both fulfillment.assignment.* topics. No customer identity,
        no contact, no address, no line items: the processor reads line items from GET
        /fulfillment/assignments and the recipient from GET
        /fulfillment/orders/{orderId}/recipient.
      required: [assignmentId, orderId, stage, state, eventVersion, occurredAt]
      properties:
        assignmentId: { type: string, description: Opaque assignment id; one per operator release. }
        orderId: { type: string, description: Opaque platform order id (scrappy_commerce_orders.order_id). }
        stage: { type: string, enum: [preview, publication] }
        state:
          type: string
          enum: [active, held, cancelled]
          description: Always active on fulfillment.assignment.created.
        eventVersion: { type: integer, minimum: 0, description: The order event_version the transition committed at. }
        occurredAt: { type: string, format: date-time }

    LabelVoidedData:
      type: object
      additionalProperties: false
      x-tot-wave: 2
      x-tot-status: planned
      description: >
        Closed four-key payload of fulfillment.label.voided. No customer identity, contact or
        address.
      required: [assignmentId, orderId, purchaseId, occurredAt]
      properties:
        assignmentId: { type: string }
        orderId: { type: string }
        purchaseId: { type: string, description: The platform purchase id of the voided label. }
        occurredAt: { type: string, format: date-time }

  messages:
    AppInstalled:
      name: appInstalled
      messageId: appInstalled
      title: app.installed
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data:
                type: object
                additionalProperties: false
                description: Envelope identity only — no fields, ever.

    AppUninstalled:
      name: appUninstalled
      messageId: appUninstalled
      title: app.uninstalled
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data:
                type: object
                additionalProperties: false
                description: Envelope identity only — no fields, ever.

    CatalogProductUpdated:
      name: catalogProductUpdated
      messageId: catalogProductUpdated
      title: catalog.product.updated
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/CatalogProductUpdateData' }

    InventoryChanged:
      name: inventoryChanged
      messageId: inventoryChanged
      title: inventory.changed
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/InventoryChangedData' }

    OrderCreated:
      name: orderCreated
      messageId: orderCreated
      title: order.created
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/OrderData' }

    OrderFulfilled:
      name: orderFulfilled
      messageId: orderFulfilled
      title: order.fulfilled
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/OrderData' }

    CustomerMarketingConsentUpdated:
      name: customerMarketingConsentUpdated
      messageId: customerMarketingConsentUpdated
      title: customer.marketing_consent.updated
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/CustomerMarketingConsentUpdatedData' }

    AttributionFinalized:
      name: attributionFinalized
      messageId: attributionFinalized
      title: attribution.finalized
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/AttributionFinalizedData' }

    OrderPartiallyFulfilled:
      name: orderPartiallyFulfilled
      messageId: orderPartiallyFulfilled
      title: order.partially_fulfilled
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/OrderData' }

    FulfillmentLabelVoided:
      name: fulfillmentLabelVoided
      messageId: fulfillmentLabelVoided
      title: fulfillment.label.voided
      x-tot-wave: 2
      x-tot-status: planned
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/LabelVoidedData' }

    FulfillmentAssignmentCreated:
      name: fulfillmentAssignmentCreated
      messageId: fulfillmentAssignmentCreated
      title: fulfillment.assignment.created
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/FulfillmentAssignmentData' }

    FulfillmentAssignmentUpdated:
      name: fulfillmentAssignmentUpdated
      messageId: fulfillmentAssignmentUpdated
      title: fulfillment.assignment.updated
      contentType: application/cloudevents+json
      traits:
        - $ref: '#/components/messageTraits/cloudEventEnvelope'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/FulfillmentAssignmentData' }
